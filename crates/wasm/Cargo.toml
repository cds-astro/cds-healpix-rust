[package]
name = "cdshealpix-wasm"
version = "0.10.2"
authors = ["F.-X. Pineau <francois-xavier.pineau@astro.unistra.fr>"]
description = """
WASM version of the CDS HEALPix library.
"""
license = "Apache-2.0 OR MIT"
readme = "README.md"
categories = ["science", "data-structures", "algorithms"]
keywords = ["healpix"]
documentation = "https://github.com/cds-astro/cds-healpix-rust/tree/main/crates/wasm"
repository = "https://github.com/cds-astro/cds-healpix-rust/tree/main/crates/wasm"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cdshealpix = { path = "../.." }
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-O3", "--enable-bulk-memory-opt", "--enable-nontrapping-float-to-int"]
#wasm-opt = false # due to error so far!
